name: Daily YouTube Content Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"

jobs:
  daily-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run daily content engine
        run: |
          echo "Daily YouTube content engine started."
          echo "Shorts: 2"
          echo "Long video: 1 (~20 minutes)"
          echo "Publishing is disabled until YouTube OAuth is securely configured."
